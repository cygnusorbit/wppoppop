<div class="wppoppop-st-root">
    <label class="wppoppop-st-check"><input type="checkbox" id="set-sidetab-enable" value="1"> Enable Sticky Side Tab</label>
    <label class="wppoppop-st-lbl" for="set-sidetab-label">Tab Label</label>
    <input type="text" id="set-sidetab-label" class="widefat" placeholder="Feedback / Offer" maxlength="40">
    <label class="wppoppop-st-lbl" for="set-sidetab-pos">Screen Edge</label>
    <select id="set-sidetab-pos" class="widefat">
        <option value="left">Left Edge</option>
        <option value="right">Right Edge</option>
    </select>
    <p class="description wppoppop-st-help">A tab pinned to the screen edge. Visitors click it to open this popup, even after they closed it.</p>
</div>
