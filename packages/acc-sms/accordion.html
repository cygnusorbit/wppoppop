<div class="wppoppop-sms-root">
    <label class="wppoppop-sms-check"><input type="checkbox" id="set-sms-enable" value="1"> Enable Lead SMS Notification</label>
    <label class="wppoppop-sms-lbl" for="set-sms-phone">Send alerts to</label>
    <input type="text" id="set-sms-phone" placeholder="+1234567890" class="widefat" maxlength="20">
    <label class="wppoppop-sms-lbl" for="set-sms-sid">Twilio Account SID</label>
    <input type="text" id="set-sms-sid" placeholder="AC..." class="widefat" maxlength="64">
    <label class="wppoppop-sms-lbl" for="set-sms-token">Twilio Auth Token</label>
    <input type="password" id="set-sms-token" placeholder="Auth token" class="widefat" maxlength="64">
    <label class="wppoppop-sms-lbl" for="set-sms-from">Twilio Sender Number</label>
    <input type="text" id="set-sms-from" placeholder="+1234567890" class="widefat" maxlength="20">
    <p class="description wppoppop-sms-help">Each new submission sends one short text (popup name and email) to the number above. Numbers use the international format with a + sign. The credentials stay private: they are never printed on the public page. Up to 20 texts per popup and hour.</p>
</div>
