<div class="wppoppop-tg-root">
    <label class="wppoppop-tg-lbl" for="set-target-auth">Visitor Authentication</label>
    <select id="set-target-auth" class="widefat">
        <option value="all">All Visitors</option>
        <option value="guest">Guests Only</option>
        <option value="user">Logged-In Users Only</option>
    </select>
    <p class="description wppoppop-tg-help">The popup is only shown to the chosen visitors. Popups opened by a button or an onload shortcode ignore this rule.</p>
</div>
