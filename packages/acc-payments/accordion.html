<div class="wppoppop-pay-root">
    <label class="wppoppop-pay-lbl" for="set-pay-gateway">Gateway</label>
    <select id="set-pay-gateway" class="widefat">
        <option value="stripe">Stripe</option>
        <option value="paypal">PayPal</option>
    </select>
    <label class="wppoppop-pay-lbl" for="set-pay-amount">Default Amount</label>
    <input type="number" step="0.01" min="0" id="set-pay-amount" placeholder="Amount (e.g. 19.99)" class="widefat">
    <p class="description wppoppop-pay-help">Used by every Pay button of this popup that has no gateway or amount of its own.</p>
</div>
