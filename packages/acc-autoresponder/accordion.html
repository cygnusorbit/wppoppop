<div class="wppoppop-auto-root">
    <label class="wppoppop-auto-check"><input type="checkbox" id="set-auto-enable" value="1"> Send Welcome Email</label>
    <label class="wppoppop-auto-lbl" for="set-auto-subject">Email Subject</label>
    <input type="text" id="set-auto-subject" class="widefat" placeholder="Welcome! Here is your reward">
    <label class="wppoppop-auto-lbl" for="set-auto-body">Message</label>
    <textarea id="set-auto-body" rows="4" class="widefat" placeholder="Thank you for subscribing!"></textarea>
    <p class="description wppoppop-auto-help">Use {email} or {field-name} to insert the subscriber's values. Sent to the visitor's email after a successful submit (not with Double Opt-In).</p>
</div>
