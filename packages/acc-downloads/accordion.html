<div class="wppoppop-dl-root">
    <label class="wppoppop-dl-check"><input type="checkbox" id="set-dl-enable" value="1"> Enable Tokenized Download</label>
    <label class="wppoppop-dl-lbl" for="set-dl-url">Protected File URL</label>
    <input type="url" id="set-dl-url" placeholder="https://example.com/wp-content/uploads/file.pdf" class="widefat" maxlength="2000">
    <p class="description wppoppop-dl-help">After a successful submit the visitor gets a single-use link, valid for 24 hours. The file address is never shown on the page. Use a file from your Media Library for a private download; not issued with Double Opt-In.</p>
</div>
