<div class="wppoppop-vid-root">
    <label class="wppoppop-vid-check"><input type="checkbox" id="set-vid-enable" value="1"> Listen for Video Playback</label>
    <input type="number" min="0" step="1" id="set-vid-time" placeholder="Trigger at timestamp (seconds)" class="widefat">
    <p class="description wppoppop-vid-help">The popup opens while a video on the page plays: when the playback reaches the timestamp, or as soon as it starts when the timestamp is 0. Works with HTML5 videos of the page.</p>
</div>
