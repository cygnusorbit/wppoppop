<label class="wppoppop-ppm-label">Popup position</label>
<div id="wppoppop-pp-grid" class="wppoppop-pp-grid"></div>
<p id="wppoppop-pp-name" class="wppoppop-pp-name"></p>

<div class="wppoppop-ppm-edge-box">
    <div class="wppoppop-ppm-edge-head">
        <strong>Screen edge padding</strong>
        <button type="button" id="set-pp-edge" class="button button-small wppoppop-ppm-edge-btn" title="Stick to edge (set all padding to 0)"><span class="dashicons dashicons-image-rotate"></span></button>
    </div>
    <div class="wppoppop-pp-pads">
        <div><label for="set-pp-top">Top</label><div class="wppoppop-pp-pad"><input type="number" id="set-pp-top" class="widefat" min="0" max="1000" step="1" value="50"><span>px</span></div></div>
        <div><label for="set-pp-bottom">Bottom</label><div class="wppoppop-pp-pad"><input type="number" id="set-pp-bottom" class="widefat" min="0" max="1000" step="1" value="50"><span>px</span></div></div>
        <div><label for="set-pp-left">Left</label><div class="wppoppop-pp-pad"><input type="number" id="set-pp-left" class="widefat" min="0" max="1000" step="1" value="50"><span>px</span></div></div>
        <div><label for="set-pp-right">Right</label><div class="wppoppop-pp-pad"><input type="number" id="set-pp-right" class="widefat" min="0" max="1000" step="1" value="50"><span>px</span></div></div>
    </div>
    <p class="wppoppop-ppm-help">Distance kept between the popup and each screen edge. 0 sticks the popup to the edge; a higher value moves it away. On screens smaller than the popup it scales down to fit.</p>
</div>
