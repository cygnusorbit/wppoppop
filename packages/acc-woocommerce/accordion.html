<div class="wppoppop-wc-root">
    <label class="wppoppop-wc-check"><input type="checkbox" id="set-wc-coupon" value="1"> Auto-Generate Dynamic Coupon</label>
    <label class="wppoppop-wc-lbl" for="set-wc-amount">Discount Amount (%)</label>
    <input type="number" id="set-wc-amount" placeholder="e.g. 15" class="widefat" min="1" max="100" step="0.01">
    <label class="wppoppop-wc-lbl" for="set-wc-days">Valid for (days)</label>
    <input type="number" id="set-wc-days" placeholder="Empty = no expiry" class="widefat" min="1" max="3650" step="1">
    <p class="description wppoppop-wc-help">Each new subscriber gets a single-use percentage coupon, locked to their email address. It is shown after the form is sent and added to their cart. Needs WooCommerce and a discount amount; not issued with Double Opt-In.</p>
</div>
