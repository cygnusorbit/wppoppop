  <line x1="24" y1="187" x2="134" y2="179" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="27" y1="190" x2="136" y2="182" stroke="#cbd5e1" stroke-width="1.2"/>
  <!-- Front Cover -->
  <rect x="26" y="12" width="112" height="166" rx="4" fill="url(#bookCoverGrad)" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Inner Border Frame -->
  <rect x="31" y="17" width="102" height="156" rx="2" fill="none" stroke="#009e6e" stroke-width="1.2"/>
  <!-- Typography -->
  <text x="82" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">GROWTH</text>
  <text x="82" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">HACKING</text>
  <text x="82" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#ffffff" stroke="#0f172a" stroke-width="2" text-anchor="middle">101</text>
  <!-- Bar Chart Pillars -->
  <rect x="46" y="148" width="7" height="14" rx="1" fill="#f87171" stroke="#0f172a" stroke-width="1.4"/>
  <rect x="58" y="136" width="7" height="26" rx="1" fill="#f87171" stroke="#0f172a" stroke-width="1.4"/>
  <rect x="70" y="122" width="7" height="40" rx="1" fill="#f87171" stroke="#0f172a" stroke-width="1.4"/>
