      <stop offset="0%" stop-color="#00e5a3"/>
      <stop offset="100%" stop-color="#00b880"/>
    </linearGradient>
  </defs>
  <!-- Book Spine 3D Perspective -->
  <path d="M 18 20 L 26 12 L 140 12 L 132 20 Z" fill="#008a60" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
